  <meta name="description"
    content="salafInit - A comprehensive Salafi Islamic learning app with Quran, Hadith, Salah timings, and study resources">
  <meta name="theme-color" content="#201D33">

  <title>salafInit</title>

  <script>
  (function(){try{
  var t=localStorage.getItem('theme')||'nightSyscall';
  var c=t==='nightSyscall'?{bg:'#161423',s:'#201D33',b:'#322D4A',t:'#E0DEF4',ts:'#908CAA',tm:'#6E6A86',k:'#A277FF',f:'#FF3366',ty:'#CBA6F7',st:'#F087BD',n:'#F6C177',o:'#80FFEA'}:
  {bg:'#fcf0e0',s:'#f5e8d8',b:'#e0d0c0',t:'#201820',ts:'#584870',tm:'#a888a8',k:'#8040e0',f:'#d03060',ty:'#9060d0',st:'#c06080',n:'#c08830',o:'#30a890'};
  var r=document.documentElement;
  r.style.setProperty('--color-bg',c.bg);r.style.setProperty('--color-surface',c.s);
  r.style.setProperty('--color-border',c.b);r.style.setProperty('--color-text',c.t);
  r.style.setProperty('--color-text-secondary',c.ts);r.style.setProperty('--color-text-muted',c.tm);
  r.style.setProperty('--color-primary',c.k);r.style.setProperty('--color-quran',c.n);
  r.style.setProperty('--color-hadith',c.o);r.style.setProperty('--color-salah',c.k);
  r.style.setProperty('--color-learn',c.ty);r.style.setProperty('--color-accent',c.n);
  r.style.setProperty('--color-danger',c.f);r.style.setProperty('--color-shia',c.f);
  r.style.setProperty('--grade-sahih',t==='nightSyscall'?'#22C55E':'#16a34a');
  r.style.setProperty('--grade-daif',c.f);r.style.setProperty('--grade-hasan',c.n);
  }catch(e){}
  })();
  </script>

  <style>
    .home-hero {
      text-align: center;
      padding: var(--spacing-2xl) 0;
      position: relative;
    }

    .home-hero__title {
      font-size: var(--font-size-3xl);
      margin-bottom: var(--spacing-sm);
      background: linear-gradient(135deg, var(--color-quran), var(--color-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .home-hero__subtitle {
      font-size: var(--font-size-base);
      color: var(--color-text-secondary);
      max-width: 36rem;
      margin: 0 auto;
      line-height: var(--line-height-relaxed);
    }

    .home-hero__bismillah {
      font-family: var(--font-arabic);
      font-size: var(--font-size-xl);
      color: var(--color-quran);
      margin-bottom: var(--spacing-lg);
      font-weight: 700;
      text-shadow: 0 0 20px rgba(246, 193, 119, 0.3);
    }

    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; cursor: pointer;
      color: var(--color-text-muted); padding: 4px;
      border-radius: var(--radius-sm); transition: color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      width: 26px; height: 26px;
    }
    .theme-toggle:hover { color: var(--color-text); background: var(--color-surface-hover); }

    @media (min-width: 768px) {
      .home-hero {
        padding: var(--spacing-3xl) 0 var(--spacing-2xl);
      }

      .home-hero__title {
        font-size: var(--font-size-4xl);
      }

      .home-hero__subtitle {
        font-size: var(--font-size-lg);
      }

      .home-hero__bismillah {
        font-size: var(--font-size-2xl);
      }
    }
  </style>
</head>
