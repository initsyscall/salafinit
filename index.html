<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="salafInit - A comprehensive Salafi Islamic learning app with Quran, Hadith, Salah timings, and study resources">
  <meta name="theme-color" content="#201D33">

  <title>salafInit</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Amiri+Quran&family=Inter:wght@400;500;600;700&family=Scheherazade+New:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href=".const/reset.css">
  <link rel="stylesheet" href=".const/tokens.css">
  <link rel="stylesheet" href=".const/layout.css">
  <link rel="stylesheet" href=".const/components/css/base-button.css">
  <link rel="stylesheet" href=".const/components/css/base-badge.css">
  <link rel="stylesheet" href=".const/components/css/base-card.css">
  <link rel="stylesheet" href="learn/.const/components/css/learn.css">
  <link rel="stylesheet" href=".const/components/css/base-state.css">
  <link rel="stylesheet" href=".const/components/css/utilities.css">
  <link rel="stylesheet" href="hadiths/.const/components/css/hadith-books.css">
  <link rel="stylesheet" href="hadiths/.const/components/css/hadith-chapters.css">
  <link rel="stylesheet" href="hadiths/.const/components/css/hadith-dashboard.css">
  <link rel="stylesheet" href="hadiths/.const/components/css/hadith-detail.css">
  <link rel="stylesheet" href="hadiths/.const/components/css/hadith-grading.css">
  <link rel="stylesheet" href="hadiths/.const/components/css/hadith-search.css">
  <link rel="stylesheet" href="quran/.const/components/css/quran-content.css">
  <link rel="stylesheet" href="quran/.const/components/css/quran-list.css">
  <link rel="stylesheet" href="quran/.const/components/css/quran-modal.css">
  <link rel="stylesheet" href="quran/.const/components/css/quran-settings.css">
  <link rel="stylesheet" href="salah/.const/components/css/salah-main.css">
  <link rel="stylesheet" href="salah/.const/components/css/salah-grid.css">
  <link rel="stylesheet" href="salah/.const/components/css/salah-extra.css">

  <style>
    .home-hero {
      text-align: center;
      padding: var(--spacing-2xl) 0;
      position: relative;
    }

    .home-hero__title {
      font-size: var(--font-size-3xl);
      margin-bottom: var(--spacing-sm);
      background: linear-gradient(135deg, var(--color-quran), var(--color-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .home-hero__subtitle {
      font-size: var(--font-size-base);
      color: var(--color-text-secondary);
      max-width: 36rem;
      margin: 0 auto;
      line-height: var(--line-height-relaxed);
    }

    .home-hero__bismillah {
      font-family: var(--font-arabic);
      font-size: var(--font-size-xl);
      color: var(--color-quran);
      margin-bottom: var(--spacing-lg);
      font-weight: 700;
      text-shadow: 0 0 20px rgba(246, 193, 119, 0.3);
    }

    @media (min-width: 768px) {
      .home-hero {
        padding: var(--spacing-3xl) 0 var(--spacing-2xl);
      }

      .home-hero__title {
        font-size: var(--font-size-4xl);
      }

      .home-hero__subtitle {
        font-size: var(--font-size-lg);
      }

      .home-hero__bismillah {
        font-size: var(--font-size-2xl);
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <a href="#/" class="header__brand">
        <img
          src="data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg' data-name='Layer 1' viewBox='0 0 24 24'%3e%3cpath fill='none' stroke='%23F6C177' stroke-miterlimit='10' stroke-width='1.5' d='M.5 21.58h23M2.42 2.42h19.17v19.17H2.42zm0 3.83h19.16'/%3e%3cpath fill='none' stroke='%23F6C177' stroke-miterlimit='10' stroke-width='1.5' d='M7.21 14.88H12v6.71H7.21zm-.96-4.8h1.92m7.66 0h1.92m-7.67 0h3.84m-11.5 0h2.87m13.42 0h2.87'/%3e%3c/svg%3e"
          alt="salafInit" style="width: 28px; height: 28px;" />
        <span class="header__brand-text">salaf.Init();</span>
      </a>
      <button class="header__hamburger" id="header-hamburger" aria-label="Menu">
        <div class="hamburger-lines">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
      <nav class="header__nav" id="header-nav">
        <a href="#quran" class="header__nav-link">Quran</a>
        <a href="#hadiths" class="header__nav-link">Hadiths</a>
        <a href="#salah" class="header__nav-link">Salah</a>
        <a href="#learn" class="header__nav-link">Learn</a>
        <a href="#utils" class="header__nav-link">Utils</a>
      </nav>
    </header>

    <main id="app-main" class="main">
    </main>

    <footer class="footer">
      <p style="margin-bottom: 4px;">Any goodness is from Allah; any mistakes are from me.</p>
      <p><a href="https://codeberg.org/initsyscall/salafInit" target="_blank" rel="noopener"
          style="color: #1e60c7; font-weight: 500;">Open Source on Codeberg</a></p>
    </footer>
  </div>

  <script src=".const/api/store.js"></script>
  <script src=".const/api/client.js"></script>
  <script src=".const/router.js"></script>
  <script src="utils/utils.js"></script>
  <script src="quran/.const/api.js"></script>
  <script src="quran/.const/tafsir.js"></script>
  <script src="hadiths/.const/api.js"></script>
  <script src="hadiths/.const/books.js"></script>
  <script src="hadiths/sunni/fetcher.js"></script>
  <script src="hadiths/sunni/index.js"></script>
  <script src="hadiths/sunni/translation.js"></script>
  <script src="salah/.const/api.js"></script>
  <script type="module" src="quran/.const/components/js/index.js"></script>
  <script src="hadiths/.const/components/js/hadith-view.js"></script>
  <script src="salah/.const/components/js/salah-view.js"></script>
  <script src="learn/index.js"></script>
  <script src="utils/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zumer/snapdom@latest/dist/snapdom.min.js"></script>
</body>

</html>
